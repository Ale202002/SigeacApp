<div class="mt-16 md:mt-20">
  <p-toast></p-toast>

  <div class="flex items-center justify-between mb-2 px-1">
    <div>
      <h2 class="text-2xl font-semibold text-gray-700">Empleados</h2>
      <p class="text-xs text-gray-500 mt-1">{{ store.items().length }} registros</p>
    </div>
    <app-new-employee
      (employeeCreated)="onEmployeeCreated($event)"
      (reloadRequested)="onReloadRequested()">
    </app-new-employee>
  </div>

  <!-- Filtros usando GenericFiltersComponent -->
  <app-generic-filters
    [estados]="store.estados"
    [plantas]="store.plantas"
    (filtersChange)="onFiltersChange($event)"
    (clear)="onClearFilters()"
    (reload)="store.refresh()">
  </app-generic-filters>

  <!-- Tabla usando GenericTable -->
  <div class="flex justify-center">
    <app-generic-table
      [items]="store.items()"
      [columns]="columns"
      [loading]="store.loading()"
      [allSelected]="store.allSelected()"
      [paginate]="true"
      [rows]="5"
      [totalRecords]="store.items().length"
      [rowsPerPageOptions]="[5, 10, 25, 50]"
      [showCheckboxes]="true"
      [showActions]="true"
      [emptyMessage]="'No hay empleados registrados.'"
      (toggleAll)="onToggleAll($event)"
      (rowToggle)="onRowToggle($event)"
      (editItem)="onEditEmployee($event)"
      (deleteItem)="onDeleteEmployee($event)"
      (pageChange)="onPageChange($event)">
    </app-generic-table>
  </div>

  <!-- Diálogo de confirmación para dar de baja empleado -->
  <app-confirmation-dialog
    [visible]="showDeleteDialog"
    title="Dar de Baja Empleado/a"
    [message]="'¿Estás seguro/a que deseas dar de baja al empleado/a ' + (employeeToDelete?.nombre || '') + '?'"
    confirmText="CONFIRMAR BAJA"
    cancelText="Cancelar"
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()">
  </app-confirmation-dialog>
</div>
