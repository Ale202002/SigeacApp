<p-toast></p-toast>

<button
  type="button"
  (click)="open()"
  class="bg-[#6CA6C1] hover:bg-[#5A93AF] text-white font-medium px-6 py-2 rounded transition disabled:opacity-50">
  Nuevo Empleado
</button>

<div *ngIf="show" class="fixed inset-0 z-50 flex items-start justify-center pt-24 bg-black/30 backdrop-blur-sm">
  <div class="bg-white w-full max-w-xl rounded shadow-lg border relative px-10 py-8">
    <h3 class="text-xl font-semibold mb-6">
      Nuevo Empleado
    </h3>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium mb-1">Nombre y Apellido</label>
        <input type="text" formControlName="nombreApellido"
               class="w-full border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#6CA6C1]"
               [class.border-red-500]="f('nombreApellido')?.invalid && f('nombreApellido')?.touched">
        <p *ngIf="f('nombreApellido')?.invalid && f('nombreApellido')?.touched" class="text-red-500 text-xs mt-1">
          Requerido.
        </p>
      </div>

      <div class="grid grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium mb-1">DNI</label>
          <input type="text" formControlName="dni"
                 class="w-full border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#6CA6C1]"
                 [class.border-red-500]="f('dni')?.invalid && f('dni')?.touched">
          <p *ngIf="f('dni')?.errors?.['required'] && f('dni')?.touched" class="text-red-500 text-xs mt-1">Requerido.</p>
          <p *ngIf="f('dni')?.errors?.['pattern'] && f('dni')?.touched" class="text-red-500 text-xs mt-1">
            Solo números (7-10 dígitos).
          </p>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Correo electrónico</label>
          <input type="email" formControlName="email"
                 class="w-full border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#6CA6C1]"
                 [class.border-red-500]="f('email')?.invalid && f('email')?.touched">
          <p *ngIf="f('email')?.invalid && f('email')?.touched" class="text-red-500 text-xs mt-1">Email inválido.</p>
        </div>
      </div>

      <div class="mt-6 flex flex-col gap-3">
        <button type="submit"
                [disabled]="form.invalid || saving"
                class="w-full bg-[#6CA6C1] hover:bg-[#5A93AF] text-white font-semibold py-2 rounded transition disabled:opacity-50 disabled:cursor-not-allowed">
          {{ saving ? 'Registrando...' : 'Registrar' }}
        </button>
        <button type="button"
                (click)="close()"
                class="w-full bg-[#555555] hover:bg-[#444444] text-white font-semibold py-2 rounded transition"
                [disabled]="saving">
          Cancelar
        </button>
      </div>
    </form>

    <button type="button" (click)="close()" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700" [disabled]="saving">
      <i class="pi pi-times text-lg"></i>
    </button>
  </div>
</div>
