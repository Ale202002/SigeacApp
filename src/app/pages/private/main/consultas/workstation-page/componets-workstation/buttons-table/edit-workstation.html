<app-edit-button 
  [item]="workstation"
  [tooltip]="''"
  (edit)="openEditDialog()">
</app-edit-button>

<div *ngIf="show()" class="fixed inset-0 z-50 flex items-start justify-center pt-16 bg-black/30 backdrop-blur-sm">
  <div class="bg-white w-full max-w-2xl rounded-lg shadow-lg border relative">
    
    <!-- Header -->
    <div class="bg-white px-8 py-6 border-b">
      <h3 class="text-2xl font-semibold text-gray-700">
        Editar Puesto
      </h3>
      <button type="button" (click)="cancel(); $event.stopPropagation()" 
              class="absolute top-4 right-4 text-gray-500 hover:text-gray-700" 
              [disabled]="saving()">
        <i class="pi pi-times text-xl"></i>
      </button>
    </div>

    <!-- Form Content -->
    <div class="px-8 py-6">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
        
        <!-- Puesto -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Puesto*</label>
          <input type="text" 
                 formControlName="ubicacion"
                 placeholder="Ej: SS-F1-01"
                 class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[#6CA6C1] transition-colors"
                 [class.border-red-500]="f('ubicacion')?.invalid && f('ubicacion')?.touched">
          <p *ngIf="f('ubicacion')?.invalid && f('ubicacion')?.touched" class="text-red-500 text-sm mt-1">
            La ubicación es requerida.
          </p>
        </div>

        <!-- Plantas -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Plantas*</label>
          <select formControlName="planta"
                  class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[#6CA6C1] transition-colors appearance-none bg-white"
                  [class.border-red-500]="f('planta')?.invalid && f('planta')?.touched">
            <option value="">Seleccionar planta</option>
            <option value="subsuelo">Subsuelo</option>
            <option value="planta baja">Planta Baja</option>
            <option value="primer piso">Primer Piso</option>
          </select>
          <p *ngIf="f('planta')?.invalid && f('planta')?.touched" class="text-red-500 text-sm mt-1">
            Seleccione una planta.
          </p>
        </div>

        <!-- Empleados -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Empleados*</label>
          <select formControlName="empleado"
                  class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[#6CA6C1] transition-colors appearance-none bg-white"
                  [class.border-red-500]="f('empleado')?.invalid && f('empleado')?.touched">
            <option value="">Seleccionar empleado</option>
            <option *ngFor="let emp of empleados" [value]="emp.id">{{ emp.nombre }}</option>
          </select>
          <p *ngIf="f('empleado')?.invalid && f('empleado')?.touched" class="text-red-500 text-sm mt-1">
            Seleccione un empleado.
          </p>
        </div>

        <!-- Equipo -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Equipo*</label>
          <select formControlName="equipo"
                  class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[#6CA6C1] transition-colors appearance-none bg-white"
                  [class.border-red-500]="f('equipo')?.invalid && f('equipo')?.touched">
            <option value="">Seleccionar equipo</option>
            <option *ngFor="let eq of equipos" [value]="eq.id">{{ eq.identificador }}</option>
          </select>
          <p *ngIf="f('equipo')?.invalid && f('equipo')?.touched" class="text-red-500 text-sm mt-1">
            Seleccione un equipo.
          </p>
        </div>

        <!-- Fecha -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Fecha*</label>
          <input type="date" 
                 formControlName="fecha"
                 class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[#6CA6C1] transition-colors"
                 [class.border-red-500]="f('fecha')?.invalid && f('fecha')?.touched">
          <p *ngIf="f('fecha')?.invalid && f('fecha')?.touched" class="text-red-500 text-sm mt-1">
            La fecha es requerida.
          </p>
        </div>

        <!-- Estado -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Estado</label>
          <select formControlName="estado"
                  class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-[#6CA6C1] transition-colors appearance-none bg-white"
                  [class.border-red-500]="f('estado')?.invalid && f('estado')?.touched">
            <option value="">Seleccionar estado</option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
          <p *ngIf="f('estado')?.invalid && f('estado')?.touched" class="text-red-500 text-sm mt-1">
            Seleccione un estado.
          </p>
        </div>

      </form>
    </div>

    <!-- Footer -->
    <div class="bg-gray-50 px-8 py-6 border-t flex gap-4">
      <button type="submit"
              (click)="submit()"
              [disabled]="form.invalid || saving()"
              class="flex-1 bg-[#6CA6C1] hover:bg-[#5A93AF] text-white font-semibold py-3 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
        {{ saving() ? 'Registrando...' : 'Registrar' }}
      </button>
      <button type="button"
              (click)="cancel(); $event.stopPropagation()"
              class="flex-1 bg-[#555555] hover:bg-[#444444] text-white font-semibold py-3 rounded-lg transition"
              [disabled]="saving()">
        Cancelar
      </button>
    </div>

  </div>
</div>
