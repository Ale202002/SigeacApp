<div class="mt-16 md:mt-20">
  <p-toast></p-toast>
  
  <div class="flex items-center justify-between mb-2 px-1">
    <div>
      <h2 class="text-2xl font-semibold text-gray-700">Puestos de Trabajo</h2>
      <p class="text-xs text-gray-500 mt-1">{{ store.items().length }} registros</p>
    </div>
    <app-new-workstation></app-new-workstation>
  </div>

  <!-- Filtros usando GenericFiltersComponent -->
  <app-generic-filters
    [estados]="store.estados"
    [plantas]="store.plantas"
    (filtersChange)="onFiltersChange($event)"
    (clear)="onClearFilters()"
    (reload)="store.refresh()">
  </app-generic-filters>

  <!-- Tabla usando GenericTable -->
  <div class="flex justify-center">
    <app-generic-table
      [items]="store.items()"
      [columns]="columns"
      [loading]="store.loading()"
      [paginate]="true"
      [rows]="5"
      [totalRecords]="store.items().length"
      [rowsPerPageOptions]="[5, 10, 25, 50]"
      [showActions]="true"
      [emptyMessage]="'No hay puestos de trabajo registrados.'"
      [editTooltip]="'Editar puesto'"
      [deleteTooltip]="'Eliminar puesto'"
      (editItem)="onEditWorkstation($event)"
      (deleteItem)="onDeleteWorkstation($event)">
    </app-generic-table>
  </div>

  <!-- Modal de Edición -->
  <app-edit-workstation-button 
    *ngIf="selectedWorkstation && showEditModal" 
    [workstation]="selectedWorkstation"
    (workstationUpdated)="onWorkstationUpdated()">
  </app-edit-workstation-button>

  <!-- Modal de Eliminación -->
  <app-delete-workstation-button 
    *ngIf="selectedWorkstation && showDeleteModal" 
    [workstation]="selectedWorkstation"
    (confirmDelete)="onConfirmDeleteWorkstation($event)">
  </app-delete-workstation-button>

</div>
