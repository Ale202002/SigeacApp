
<div class="bg-white rounded-xl shadow-md p-6 w-full max-w-4xl ml-auto mr-8 overflow-x-auto">
    <div class="flex justify-between items-center mb-4">
    <h2 class="text-3xl font-bold text-gray-800 mb-4">Empleados</h2>
    <button pButton type="button" label="Nuevo Empleado" class="p-button-raised p-button-secondary px-8 py-3 font-semibold text-lg" style="background-color:#7DB6C8"></button>
    </div>
    <div class="flex gap-4 mb-6">
        <div class="relative w-80">
            <input pInputText type="text" [(ngModel)]="searchValue" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar..." class="w-full pr-12 text-lg py-2" />
            <span class="absolute right-4 top-3 text-gray-400 text-xl"><i class="pi pi-search"></i></span>
        </div>
    </div>
    <p-table
        #dt
        [value]="usuarios"
        [rowHover]="true"
        [rows]="10"
        [showCurrentPageReport]="true"
        [rowsPerPageOptions]="[10, 25, 50]"
        [paginator]="true"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuarios"
        [filterDelay]="0"
        [globalFilterFields]="['nombre', 'estado', 'email', 'puesto']"
        class="shadow rounded-xl overflow-hidden text-lg"
    >
        <ng-template pTemplate="header">
            <tr class="bg-[#E8773C] text-white text-lg">
                <th style="width:40px"><p-tableHeaderCheckbox /></th>
                <th>Nombre</th>
                <th>Estado</th>
                <th>Correo</th>
                <th>Puesto</th>
                <th style="width: 80px"></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
            <tr>
                <td><p-tableCheckbox [value]="user" /></td>
                <td><i class="pi pi-user mr-2"></i>{{ user.nombre }}</td>
                <td>
                    <p-tag value="activo" severity="success" *ngIf="user.estado === 'activo'"></p-tag>
                    <p-tag value="inactivo" severity="danger" *ngIf="user.estado !== 'activo'"></p-tag>
                </td>
                <td>{{ user.email }}</td>
                <td>{{ user.puesto }}</td>
                <td>
                    <button pButton icon="pi pi-trash" class="p-button-text" (click)="onDelete(user)"></button>
                    <button pButton icon="pi pi-pencil" class="p-button-text" (click)="onEdit(user)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6">No se encontraron usuarios.</td>
            </tr>
        </ng-template>
    </p-table>
    <div class="flex justify-center mt-6">
    <button pButton type="button" label="Descargar" class="p-button-raised p-button-secondary px-8 py-3 font-semibold text-lg" style="background-color:#7DB6C8"></button>
    
</div>
