<div class="w-full">
  <!-- Tabla -->
  <p-table 
    [value]="paginatedItems" 
    [loading]="loading"
    responsiveLayout="scroll"
    class="w-full"
    styleClass="rounded-lg overflow-hidden border border-gray-200">
    
    <ng-template pTemplate="header">
      <tr style="background-color: #e8773c; color: black;">
        <th *ngIf="showCheckboxes" class="text-center rounded-tl-lg" style="width: 3rem;">
          <p-checkbox 
            [ngModel]="allSelected" 
            (onChange)="onToggleAll($event)"
            [binary]="true">
          </p-checkbox>
        </th>
        <th *ngFor="let col of columns; let first = first; let last = last" 
            [style.width]="col.width" 
            class="text-left font-semibold"
            [class.rounded-tl-lg]="first && !showCheckboxes"
            [class.rounded-tr-lg]="last && !showActions">
          {{ col.header }}
        </th>
        <th *ngIf="showActions" class="text-center rounded-tr-lg" style="width: 8rem;">
          <!-- Sin título para las acciones -->
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr class="border-b border-gray-200 hover:bg-gray-50">
        <td *ngIf="showCheckboxes" class="text-center">
          <p-checkbox 
            [ngModel]="item.selected" 
            (onChange)="onRowToggle(item)"
            [binary]="true">
          </p-checkbox>
        </td>
        
        <td *ngFor="let col of columns" class="py-3 px-4">
          <ng-container [ngSwitch]="col.type">
            
            <!-- Tipo status: badge verde con check -->
            <span *ngSwitchCase="'status'" 
                  class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium"
                  [ngClass]="{
                    'bg-green-100 text-green-800': getStatusSeverity(item, col.field) === 'success',
                    'bg-red-100 text-red-800': getStatusSeverity(item, col.field) === 'danger',
                    'bg-gray-100 text-gray-800': getStatusSeverity(item, col.field) === 'secondary'
                  }">
              <i class="pi pi-check mr-1" 
                 *ngIf="getStatusSeverity(item, col.field) === 'success'"></i>
              <i class="pi pi-times mr-1" 
                 *ngIf="getStatusSeverity(item, col.field) === 'danger'"></i>
              {{ getStatusLabel(item, col.field) }}
            </span>
            
            <!-- Tipo custom: para campos especiales como usuario con icono -->
            <div *ngSwitchCase="'custom'" class="flex items-center">
              <i class="pi pi-user text-gray-500 mr-2"></i>
              <span style="color: #555555;">{{ getFieldValue(item, col.field) }}</span>
            </div>
            
            <!-- Tipo text: texto simple (default) -->
            <span *ngSwitchDefault style="color: #555555;">
              {{ getFieldValue(item, col.field) }}
            </span>
            
          </ng-container>
        </td>
        
        <td *ngIf="showActions" class="text-center py-3 px-4">
          <div class="flex justify-center gap-2">
            <button 
              (click)="onEdit(item)"
              class="p-1 rounded hover:bg-gray-100"
              title="Editar"
              style="color: #555555;">
              <i class="pi pi-pencil"></i>
            </button>
            <button 
              (click)="onDelete(item)"
              class="p-1 rounded hover:bg-gray-100"
              title="Eliminar"
              style="color: #555555;">
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="columns.length + (showCheckboxes ? 1 : 0) + (showActions ? 1 : 0)" 
            class="text-center py-8 text-gray-500">
          {{ emptyMessage }}
        </td>
      </tr>
    </ng-template>
    
  </p-table>

  <!-- Paginación Personalizada -->
  <div *ngIf="paginate && items.length > 0" class="flex justify-center mt-4">
    <p-paginator 
      [first]="first" 
      [rows]="currentRows" 
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="rowsPerPageOptions"
      (onPageChange)="onPageChange($event)"
      styleClass="custom-paginator">
    </p-paginator>
  </div>
</div>
