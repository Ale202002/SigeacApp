<div class="flex h-screen items-center justify-center bg-[#F5F5F5] font-red-hat-display">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-md border border-[#6C6C6C]">
    <img src="/assets/logo.png" alt="Logo" class="mx-auto mb-6 w-24" />
    <h2 class="text-2xl font-bold mb-4 text-center text-[#064b59]">Iniciar Sesión</h2>
    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-4">
      <input type="email" formControlName="Email" placeholder="Correo electrónico" class="w-full px-4 py-2 border border-[#136F7C] rounded focus:outline-none focus:ring-2 focus:ring-[#064b59]" />
      @if (loginForm.get('Email')?.invalid && loginForm.get('Email')?.touched) {
        <div class="text-[#E47547] text-sm">El correo electrónico es obligatorio y debe ser válido</div>
      }
      <input type="password" formControlName="Contrasena" placeholder="Contraseña" class="w-full px-4 py-2 border border-[#136F7C] rounded focus:outline-none focus:ring-2 focus:ring-[#064b59]" />
      @if (loginForm.get('Contrasena')?.invalid && loginForm.get('Contrasena')?.touched) {
        <div class="text-[#E47547] text-sm">La contraseña es obligatoria</div>
      }
      <button type="submit" class="w-full bg-[#064b59] text-white py-2 rounded hover:bg-[#136F7C] transition-colors font-bold">Iniciar Sesión</button>
      @if (error) {
        <div class="text-[#E47547] text-center">{{ error }}</div>
      }
    </form>
  </div>
</div>
<style>
  .font-red-hat-display {
    font-family: 'Red Hat Display', sans-serif;
  }
</style>
